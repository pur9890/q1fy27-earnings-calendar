name: Update & deploy earnings calendar

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you run it manually from the Actions tab
  schedule:
    # Refresh every 30 minutes. GitHub's free cron is best-effort and can drop or
    # delay individual runs, so cron-job.org also hits this workflow's dispatch
    # API every ~30 min as the reliable trigger (see repo README / setup notes).
    - cron: "*/30 * * * *"   # every 30 minutes (UTC; interval is timezone-agnostic)

permissions:
  contents: write        # allow committing the fetched actuals/times/tickers back
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape MoneyControl and build the calendar
        run: |
          python update_calendar.py
          # Result times (BSE) + NSE tickers: fast now - companies not on BSE are
          # recorded once and never re-checked, so only brand-new companies get a lookup.
          python build_release_times.py || echo "time-builder skipped; using committed times"
          python build_tickers.py       || echo "ticker-builder skipped; using committed tickers"
          # Actuals from Screener: small batch (5/run) to keep builds fast.
          python build_actuals.py       || echo "actuals-builder skipped; using committed actuals"
          python update_calendar.py
          # Rebuild so the freshly-found times, tickers and actuals are baked into the page.
          python update_calendar.py
          mkdir -p _site
          cp earnings_calendar.html _site/index.html
          cp estimates.html _site/estimates.html || true
          cp earnings_data.json _site/earnings_data.json || true
          cp estimates.json _site/estimates.json || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Persist fetched data so it accumulates (actuals/times/tickers)
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add actuals.json release_times.json tickers.json
          if git diff --cached --quiet; then
            echo "no new data to persist"
          else
            git commit -m "data: persist fetched actuals/times/tickers [skip ci]"
            git pull --rebase --autostash origin main || true
            git push
          fi
